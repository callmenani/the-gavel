name = "the-gavel-api"
main = "worker.js"
compatibility_date = "2024-11-01"

[observability.logs]
enabled = true
invocation_logs = true
persist = true

# Bind Cloudflare D1 database (create in YOUR account: `wrangler d1 create the-gavel-db`)
[[d1_databases]]
binding = "DB"
database_name = "the-gavel-db"
# Replace with the uuid from `wrangler d1 create` or `wrangler d1 list` (not another account's id).
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"


