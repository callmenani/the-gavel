<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gavelGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5E1A3"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8C6A14"/>
    </linearGradient>
    <linearGradient id="gavelHandle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4B5563"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>
  </defs>
  <g transform="rotate(45 32 32)">
    <!-- Sound block / base -->
    <rect x="14" y="50" width="36" height="8" rx="4" fill="url(#gavelHandle)"/>
    <!-- Handle -->
    <rect x="29.5" y="26" width="5" height="28" rx="2.5" fill="url(#gavelHandle)"/>
    <!-- Gavel head -->
    <rect x="16" y="8" width="32" height="20" rx="5" fill="url(#gavelGold)"/>
    <!-- Head end caps -->
    <rect x="14" y="11" width="5" height="14" rx="2.5" fill="#8C6A14"/>
    <rect x="45" y="11" width="5" height="14" rx="2.5" fill="#8C6A14"/>
    <!-- Highlight stripe -->
    <rect x="22" y="12" width="4" height="12" rx="2" fill="#FFF7DB" opacity="0.55"/>
  </g>
</svg>
