    <!-- Apply the saved colour theme before first paint to avoid a flash.
         Defaults to the original dark theme; "light" opts into light mode. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('the_gavel_theme');
          if (t === 'light' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)) {
            document.documentElement.classList.add('light');
          }
        } catch (e) {}
      })();
    </script>
